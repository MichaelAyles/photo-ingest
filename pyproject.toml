[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banger"
version = "0.0.1"
description = "Local image triage and develop pipeline for the Sony a6600"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Michael Ayles" }]
license = { text = "Unlicensed" }
dependencies = [
    "torch>=2.2",
    "open_clip_torch>=2.24",
    "rawpy>=0.21",
    "imagehash>=4.3",
    "Pillow>=10.0",
    "numpy>=1.26,<2",  # transformers/siglip C extensions still expect NumPy 1.x ABI
    "opencv-python>=4.9",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "flask>=3.0",
]

# aesthetic-predictor-v2.5 is a GitHub project, not on PyPI.
# Install it separately, see README install section.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
gui = [
    "pywebview>=6.0",
]

[project.scripts]
banger = "banger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/banger"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
